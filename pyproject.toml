[project]
name = "claudetop"
version = "0.1.0"
description = "Terminal UI for monitoring running Claude Code instances and saved sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "0xwagmi" }]
keywords = ["claude", "claude-code", "tui", "textual", "monitor"]
classifiers = [
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/0xwagmi/claudetop"
Repository = "https://github.com/0xwagmi/claudetop"
Issues = "https://github.com/0xwagmi/claudetop/issues"

[project.scripts]
ctop = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["app.py", "core.py", "main.py"]
